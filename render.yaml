# Nguồn cấu hình duy nhất của Render. Sửa ở đây rồi push, đừng chỉnh tay trong
# dashboard — chỉnh tay là file này và service thật lệch nhau, lần deploy sau
# không ai biết cái nào đúng.

databases:
  - name: quanlytrungtam-db
    plan: free
    region: singapore
    # Rỗng = chỉ nhận kết nối nội bộ trong Render, không mở ra Internet.
    # Cần nối bằng pgAdmin/DBeaver từ máy thì thêm IP của bạn vào đây.
    ipAllowList: []

services:
  - type: web
    name: quanlytrungtam-app
    runtime: node
    plan: free
    # Phải cùng region với database, khác region thì hostname nội bộ
    # (dpg-xxx-a) không phân giải được → getaddrinfo ENOTFOUND.
    region: singapore
    branch: main
    healthCheckPath: /

    # Cố tình để giống hệt lệnh mặc định của Render ('npm install; npm run build').
    # Script postinstall ở gốc lo việc cài backend + frontend, nên service tạo tay
    # dùng lệnh mặc định cũng chạy đúng, không cần ai dán lại chuỗi này.
    # Seed không nằm ở đây nữa: app tự seed lúc khởi động khi DB rỗng.
    buildCommand: npm install && npm run build
    # NODE_ENV đặt ở đây chứ KHÔNG đặt trong envVars: envVars áp dụng cho cả
    # lúc build, mà NODE_ENV=production làm npm bỏ qua devDependencies nên
    # `vite build` chết với "vite: not found". App chỉ cần biến này lúc chạy.
    startCommand: NODE_ENV=production npm start

    envVars:
      # Ghim để Render đổi Node mặc định không làm hỏng build đang chạy tốt.
      - key: NODE_VERSION
        value: "22"
      - key: SESSION_SECRET
        generateValue: true
      # Postgres chứ không SQLite: sqlite3 là native module, bản prebuilt cần
      # glibc mới hơn máy chủ Render (ERR_DLOPEN_FAILED). Driver pg là JS thuần.
      # Ổ đĩa Render cũng là ephemeral nên SQLite mất sạch mỗi lần deploy.
      - key: DATABASE_URL
        fromDatabase:
          name: quanlytrungtam-db
          property: connectionString
