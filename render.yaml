# Postgres chứ không phải SQLite: driver `pg` là JavaScript thuần, còn `sqlite3`
# là native module và bản prebuilt của nó cần glibc mới hơn máy chủ Render
# (ERR_DLOPEN_FAILED / GLIBC_2.38 not found). Postgres cũng giữ được dữ liệu,
# SQLite trên Render mất sạch mỗi lần deploy vì ổ đĩa là ephemeral.
databases:
  - name: quanlytrungtam-db
    plan: free
    region: singapore

services:
  - type: web
    name: quanlytrungtam-app
    env: node
    plan: free
    region: singapore
    buildCommand: npm run install-all && npm run build && npm run seed
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      # DB và web service phải cùng region thì hostname nội bộ mới phân giải được.
      - key: DATABASE_URL
        fromDatabase:
          name: quanlytrungtam-db
          property: connectionString
