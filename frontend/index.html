        extend: {

            "on-primary": "#ffffff",
            "primary-container": "#96f0c0",
            "on-primary-container": "#002113",

            "on-surface": "#161d1f",
            "surface-variant": "#e8eff1",
            "on-surface-variant": "#3f4942",
            "outline": "#6f7a72",
            "background": "#ffffff",
            "on-background": "#161d1f",
            "surface-container-low": "#f4fafd",
            "surface-container": "#e8eff1",

            "surface-container-highest": "#d3dbd6",
            "surface-container-lowest": "#ffffff",
            "outline-variant": "#bec9c0",

  </script>
  <script>
      (function () {
        let savedTheme = localStorage.getItem('theme_color');
        let savedHover = localStorage.getItem('theme_color_hover');
        if (!savedTheme || savedTheme.toLowerCase() === '#2563eb' || savedTheme.toLowerCase() === '#1d4ed8') {
          savedTheme = '#00704a';
          savedHover = '#005236';
          localStorage.setItem('theme_color', savedTheme);
          localStorage.setItem('theme_color_hover', savedHover);
        }
        if (savedTheme && savedHover) {
          document.documentElement.style.setProperty('--primary', savedTheme);
          document.documentElement.style.setProperty('--primary-hover', savedHover);
        }
      })();
  </script>
