<!doctype html>
<html lang="vi" class="scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trung Tâm Học Thêm Online</title>

  <!-- Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">

  <!-- Fonts (Optimized Core Font Families with display=swap) -->
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Inter:wght@400;500;600;700;800&family=Manrope:wght@500;600;700&family=Hanken+Grotesk:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block"
    rel="stylesheet">

  <!-- Site CSS -->
  <link rel="stylesheet" href="/css/site.css?v=20260712" />
  <link rel="stylesheet" href="/css/custom-theme.css?v=20260712" />
  <!-- Cropper.js (deferred: only used by ProfileModal's avatar cropper, not needed for initial render) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" media="print" onload="this.media='all'" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js" defer></script>
  <script>
      (function () {
        let savedTheme = localStorage.getItem('theme_color');
        let savedHover = localStorage.getItem('theme_color_hover');
        if (!savedTheme || savedTheme.toLowerCase() === '#00704a' || savedTheme.toLowerCase() === '#2563eb') {
          savedTheme = '#1d4ed8';
          savedHover = '#1e40af';
          localStorage.setItem('theme_color', savedTheme);
          localStorage.setItem('theme_color_hover', savedHover);
        }
        if (savedTheme && savedHover) {
          document.documentElement.style.setProperty('--primary', savedTheme);
          document.documentElement.style.setProperty('--primary-hover', savedHover);
        }
      })();
  </script>
</head>

<body class="antialiased font-sans bg-[#eef5ff] text-slate-900 scroll-smooth">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
