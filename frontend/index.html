  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "primary": "#2563eb", // Vibrant Blue
            "on-primary": "#ffffff",
            "primary-container": "#1e3a8a",
            "on-primary-container": "#ffffff",
            "secondary": "#06b6d4", // Cyan 500
            "accent": "#38bdf8", // Sky Blue Glow
            "gold": "#ffd700", // Vibrant Gold Accent
            "surface": "#4a68b3", // Soft Lighter White-Blended Blue
            "on-surface": "#ffffff",
            "surface-variant": "#5b79c4",
            "on-surface-variant": "#f1f5f9",
            "outline": "#94a3b8",
            "background": "#4a68b3",
            "on-background": "#ffffff",
            "surface-container-low": "#3d599c",
            "surface-container": "#4a68b3",
            "surface-container-high": "#5b79c4",
            "surface-container-highest": "#6c8ad5",
            "surface-container-lowest": "#344f8d",
            "outline-variant": "#64748b",
            "vibrant-blue": "#2563eb",
            "vibrant-sky": "#06b6d4"
          },
          "borderRadius": {
            "DEFAULT": "0.5rem",
            "lg": "0.75rem",
            "xl": "1rem",
            "full": "9999px"
          },
          "spacing": {
            "max-width": "1280px",
            "gutter": "24px",
            "margin-mobile": "16px",
            "margin-desktop": "64px",
            "base": "8px"
          },

            "sans": ["Inter", "Manrope", "sans-serif"],
            "serif": ["Source Serif 4", "serif"]
          }
        }
      }
    }
  </script>
  <script>
      (function () {
        let savedTheme = localStorage.getItem('theme_color');
        let savedHover = localStorage.getItem('theme_color_hover');
        if (!savedTheme || savedTheme.toLowerCase() === '#064e3b' || savedTheme.toLowerCase() === '#022c22') {
          savedTheme = '#2563eb';
          savedHover = '#1d4ed8';
          localStorage.setItem('theme_color', savedTheme);
          localStorage.setItem('theme_color_hover', savedHover);
        }
        if (savedTheme && savedHover) {
          document.documentElement.style.setProperty('--primary', savedTheme);
          document.documentElement.style.setProperty('--primary-hover', savedHover);
        }
      })();
  </script>
</head>

<body class="antialiased font-sans bg-[#4a68b3] text-white scroll-smooth">
