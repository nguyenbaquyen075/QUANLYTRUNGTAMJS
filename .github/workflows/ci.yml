name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # postinstall runs install-all, so this installs backend and frontend too
      - run: npm install
      - run: npm test --prefix backend
      - run: npm run build
