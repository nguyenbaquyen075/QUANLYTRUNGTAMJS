# Render gói Free ngủ sau 15 phút không có traffic (lần vào sau đó chờ ~50s).
# Job này ping app mỗi 10 phút để service luôn thức.
# Đổi APP_URL nếu tên service trên Render khác.
name: Keep Render awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app
        env:
          APP_URL: https://quanlytrungtam-app.onrender.com
        run: curl -sSfL --max-time 90 --retry 3 --retry-delay 20 -o /dev/null "$APP_URL"
